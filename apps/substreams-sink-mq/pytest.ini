[pytest]
# Pytest configuration for Substreams Message Queue Sinks
# Ensures consistent test behavior across all Python components

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting - default to unit tests only for fast feedback
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=scripts
    --cov-report=term-missing
    --cov-fail-under=80
    --no-cov-on-fail
    -m "not integration and not slow"

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components (fast, no external dependencies)
    integration: Integration tests with real services (requires Docker)
    slow: Tests that take longer than 5 seconds
    kafka_slow: Kafka integration tests that may take several minutes
    requires_protoc: Tests that require protoc to be installed
    requires_docker: Tests that require Docker to be running

# Warning filters
filterwarnings =
    ignore::DeprecationWarning:testcontainers.*

# Coverage configuration
[coverage:run]
source = scripts
omit =
    */test_*
    */__pycache__/*
    */.*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

show_missing = true
precision = 2

[coverage:html]
directory = htmlcov