syntax = "proto3";

package test;

message SimpleMessage {
  string id = 1;
  uint64 amount = 2;
  string from_address = 3;
  string to_address = 4;

  oneof transaction_type {
    TransferData transfer = 10;
    MintData mint = 11;
  }
}

message TransferData {
  uint64 amount = 1;
  string recipient = 2;
}

message MintData {
  uint64 amount = 1;
  string authority = 2;
}