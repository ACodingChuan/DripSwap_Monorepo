// ============================================================================
// EDGE CASES AND SPECIAL SCENARIOS
// ============================================================================

message EdgeCases {
    option (sf.substreams.sink.sql.schema.v1.table) = {
        name: "edge_cases"
    };

    // Field with reserved name (might conflict with SQL keywords)
    string select = 1;
    string from = 2;
    string where = 3;
    string order = 4;
    string group = 5;

    // Very long field names
    string this_is_a_very_long_field_name_that_might_cause_issues_with_column_length_limits = 6;

    // Numeric field numbers
    string field_1 = 101;
    string field_2 = 102;
    string field_1000 = 1000;

    // Mixed case and underscores
    string CamelCaseField = 110;
    string snake_case_field = 111;
    string UPPER_CASE_FIELD = 112;
    string mixedCase_snake_Field = 113;

    // Empty and default values
    string empty_string = 120;
    uint64 zero_number = 121;
    bool false_flag = 122;
    repeated string empty_array = 123;

    // Primary key
    string edge_case_id = 200 [(sf.substreams.sink.sql.schema.v1.field) = {
        primary_key: true
    }];
}