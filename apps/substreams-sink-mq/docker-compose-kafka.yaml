services:
  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.1
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-0:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda-0:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      - --mode dev-container
      - --smp 2
      - --memory 2G
      - --default-log-level=info
    ports:
      - 19092:19092
      - 18082:18082
      - 18081:18081
      - 19644:9644
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles:
      - kafka-basic
      - kafka-sink

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.6
    environment:
      KAFKA_BROKERS: redpanda-0:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: true
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda-0:8081
    ports:
      - "8080:8080"
    depends_on:
      redpanda-0:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - kafka-basic
      - kafka-console

  substreams-kafka-sink:
    image: substreams-kafka-sink:latest
    container_name: substreams-kafka-sink
    build:
      context: .
      dockerfile: substreams-kafka-sink/Dockerfile
    environment:
      - SUBSTREAMS_API_TOKEN_FILE=/run/secrets/substreams_token
      - SUBSTREAMS_ENDPOINT=https://sepolia.substreams.pinax.network:443
      - SUBSTREAMS_PACKAGE_FILE=/dripswap-uniswap-v2-events-v0.1.0.spkg
      - SUBSTREAMS_MODULE_NAME=map_uniswap_events
      - SUBSTREAMS_MODULE_PARAMS=chain_id=11155111;factory=0x6c9258026a9272368e49bbb7d0a78c17bbe284bf
      - SUBSTREAMS_START_BLOCK=9573280
      - SUBSTREAMS_STOP_BLOCK=9573281
      - SUBSTREAMS_CURSOR_FILE=/app/state/cursor.txt
      - LOG_LEVEL=info
      - KAFKA_BROKERS=redpanda-0:9092
      - TOPIC_PREFIX=dripswap
      - FANOUT_CONFIG_PATH=/app/configs/uniswap-v2-fanout.yaml
      - PROTO_SCHEMA_DIR=/proto
      - PROTO_MESSAGE_TYPE=messari.uniswap.v2.Events
    secrets:
      - substreams_token
    volumes:
      - "../substreamv2/dripswap-uniswap-v2-events-v0.1.0.spkg:/dripswap-uniswap-v2-events-v0.1.0.spkg:ro"
      - "../substreamv2/proto:/proto:ro"
      - "./configs:/app/configs:ro"
      - "./logs:/app/logs"
      - "./state:/app/state"
    depends_on:
      redpanda-0:
        condition: service_healthy
    profiles:
      - kafka-sink

volumes:
  redpanda_data: {}

secrets:
  substreams_token:
    file: ./secrets/substreams_token.txt
