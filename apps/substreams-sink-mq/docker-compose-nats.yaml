services:
  nats-server:
    image: nats:2.10.5-alpine
    container_name: nats-server
    command:
      - "-c"
      - "/etc/nats/nats-server.conf"
      - "-D"
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    volumes:
      - "./configs/nats-server.conf:/etc/nats/nats-server.conf:ro"
      - "nats_jetstream_data:/data"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles:
      - nats-basic
      - nats-sink

  nats-box:
    image: natsio/nats-box:latest
    container_name: nats-box
    depends_on:
      nats-server:
        condition: service_healthy
    profiles:
      - nats-basic
      - nats-tools

  substreams-nats-sink:
    image: substreams-nats-sink:latest
    container_name: substreams-nats-sink
    build:
      context: .
      dockerfile: substreams-nats-sink/Dockerfile
    environment:
      - SUBSTREAMS_API_TOKEN_FILE=/run/secrets/substreams_token
      - SUBSTREAMS_ENDPOINT=https://mainnet.sol.streamingfast.io:443
      - SUBSTREAMS_PACKAGE_FILE=/solana-spl-all-tokens-v0.1.0.spkg
      - SUBSTREAMS_MODULE_NAME=map_spl_instructions
      - SUBSTREAMS_START_BLOCK=${SUBSTREAMS_START_BLOCK:-31310775}
      - SUBSTREAMS_STOP_BLOCK=${SUBSTREAMS_STOP_BLOCK:-32310775}
      - LOG_LEVEL=info
      - NATS_SERVER_URL=nats-server:4222
      - NATS_SUBJECT_PREFIX=spl
      - NATS_STREAM_NAME=substreams
      - ENABLE_STRUCTURED_OUTPUT=true
      - ENABLE_MULTI_TOPIC_FANOUT=true
      - FANOUT_CONFIG_PATH=/app/configs/spl-fanout.yaml
      - PROTO_SCHEMA_DIR=/proto/sf/solana/v1/spl/type
      - PROTO_MESSAGE_TYPE=sf.solana.spl.v1.type.SplInstructions
    secrets:
      - substreams_token
    volumes:
      - "./example-substream/substreams-spl-all-tokens/solana-spl-all-tokens-v0.1.0.spkg:/solana-spl-all-tokens-v0.1.0.spkg:ro"
      - "./example-substream/substreams-spl-all-tokens/proto:/proto:ro"
      - "./configs:/app/configs:ro"
      - "./logs:/app/logs"
    depends_on:
      nats-server:
        condition: service_healthy
    profiles:
      - nats-sink

volumes:
  nats_jetstream_data: {}

secrets:
  substreams_token:
    file: ./secrets/substreams_token.txt
