# NATS Server Configuration for Substreams Pipeline
#
# JetStream-enabled NATS server optimized for high-throughput
# blockchain data ingestion from Substreams

# Basic server configuration
server_name: nats-blockchain-proxy
listen: 0.0.0.0:4222

# HTTP monitoring
http_port: 8222

# Logging
debug: false
trace: false
logtime: true

# JetStream configuration for persistent messaging  
jetstream: {
    # Storage location
    store_dir: "/data"

    # Memory and file storage limits - matched to Redpanda resource allocation
    max_memory_store: 4GB
    max_file_store: 50GB
}

# Connection and message limits
max_connections: 1000
max_control_line: 2KB
max_payload: 8MB
max_pending: 64MB

# Performance settings
write_deadline: "10s"